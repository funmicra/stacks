services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: Heimdall
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - config:/config
    ports:
      - 86:80
      - 8443:443
    restart: unless-stopped

networks:
  default:
    external: true
    name: Apps-Network

volumes:
  config:
