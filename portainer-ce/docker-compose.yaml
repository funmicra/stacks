services:
    portainer-ce:
        ports:
            - 8000:8000
            - 9443:9443
        container_name: Portainer-CE
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - data:/data
        image: portainer/portainer-ce:latest
networks:
  default:
    external: true
    name: Apps-Network
volumes:
  data:
