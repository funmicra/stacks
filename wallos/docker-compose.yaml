services:
  wallos:
    container_name: Wallos
    image: bellamy/wallos:latest
    ports:
      - "8282:80/tcp"
    environment:
      TZ: 'Europe/Athens'
    volumes:
      - db:/var/www/html/db
      - logos:/var/www/html/images/uploads/logos
    restart: unless-stopped
networks:
  default:
    external: true
    name: Apps-Network
volumes:
  db:
  logos:
